{"openapi":"3.0.1","info":{"title":"EMS API","description":"Public endpoints are exposed under /public/**. Protected endpoints are exposed under /api/** and require a valid license key.","contact":{"name":"Raphael Paquin","url":"https://www.linkedin.com/in/raphee/","email":"raph@eight-ms.com"},"version":"1.0.0"},"servers":[{"url":"http://ems-service-dev-317696638565.us-east4.run.app","description":"Generated server url"}],"paths":{"/api/parts-bike/search":{"post":{"tags":["parts-bike-controller"],"summary":"Search parts bikes","description":"Searches parts bikes using the provided search criteria.\n\nPaging is applied using the page and size values from the request body.\n\nThis endpoint returns a paginated list of basic parts bike information.\n","operationId":"searchPartsBikes","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/PartBikeSearchDto"}}},"required":true},"responses":{"200":{"description":"Parts bikes searched successfully","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Page"}}}},"400":{"description":"Invalid search request","content":{"application/json":{}}},"401":{"description":"Missing or invalid license key"}},"security":[{"LicenseKey":[]}]}},"/api/parts-bike/save":{"post":{"tags":["parts-bike-controller"],"summary":"Save parts bike","description":"Creates or updates a parts bike.\n\nRules:\n- If id is null, a new parts bike is created.\n- If id is provided, the existing parts bike is updated.\n- bikeVariantId is required.\n- bikeVariantId must reference an existing bike variant.\n- photoUrls should contain URLs previously returned by the image upload endpoint.\n- thumbnailUrl can reference one of the uploaded image URLs.\n","operationId":"savePartsBike","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SavePartsBikeDto"}}},"required":true},"responses":{"200":{"description":"Parts bike saved successfully","content":{"application/json":{"schema":{"type":"integer","format":"int64"}}}},"400":{"description":"Invalid parts bike data or referenced bike variant does not exist","content":{"application/json":{}}},"401":{"description":"Missing or invalid license key"}},"security":[{"LicenseKey":[]}]}},"/api/parts-bike/image/upload":{"post":{"tags":["parts-bike-controller"],"summary":"Upload parts bike image","description":"Uploads a single image for a parts bike workflow.\n\nAccepted file types:\n- PNG\n- JPG\n- JPEG\n\nThis endpoint uploads the image to S3 and returns the uploaded image URL.\n\nThe returned URL can then be included in SavePartsBikeDto.photoUrls\nor SavePartsBikeDto.thumbnailUrl when creating or updating a parts bike.\n","operationId":"uploadPartsBikeImage","requestBody":{"content":{"multipart/form-data":{"schema":{"required":["picture"],"type":"object","properties":{"picture":{"type":"string","description":"Image file to upload. Supported extensions: png, jpg, jpeg.","format":"binary"}}}}}},"responses":{"400":{"description":"Invalid image file or unsupported file type","content":{"application/json":{}}},"200":{"description":"Image uploaded successfully","content":{"text/plain":{"schema":{"type":"string"}}}},"401":{"description":"Missing or invalid license key"}},"security":[{"LicenseKey":[]}]}},"/api/make":{"post":{"tags":["make-controller"],"summary":"Create a motorcycle make","description":"Creates a new motorcycle make, such as Honda, Kawasaki, Yamaha, Triumph, etc.","operationId":"createMake","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/MakeRequest"}}},"required":true},"responses":{"400":{"description":"Invalid request body","content":{"application/json":{"schema":{"type":"integer","format":"int64"}}}},"401":{"description":"Missing or invalid license key"},"200":{"description":"Make created successfully","content":{"application/json":{"schema":{"type":"integer","format":"int64"}}}}},"security":[{"LicenseKey":[]}]}},"/api/bike-variant":{"post":{"tags":["bike-variant-controller"],"summary":"Create or update a bike variant","description":"Creates or updates a bike variant.\n\nThis endpoint can also create a motorcycle model when modelId is not provided.\n\nRules:\n- If bikeVariantId is provided, the existing bike variant is updated.\n- If bikeVariantId is not provided, a new bike variant is created.\n- If modelId is provided, the existing model is used.\n- If modelId is not provided, a new model is created using makeId and modelName.\n- makeId must reference an existing make when creating a new model.\n- Provided model and bike variant ids must exist.\n","operationId":"saveBikeVariant","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/SaveBikeVariantDto"}}},"required":true},"responses":{"400":{"description":"Invalid bike variant payload","content":{"application/json":{}}},"200":{"description":"Bike variant saved successfully","content":{"application/json":{"schema":{"$ref":"#/components/schemas/BikeVariant"}}}},"401":{"description":"Missing or invalid license key"}},"security":[{"LicenseKey":[]}]}},"/api/bike-variant/{bikeVariantId}/manual":{"post":{"tags":["bike-variant-controller"],"summary":"Upload service manual PDF","description":"Uploads a PDF service manual for an existing bike variant.\n\nRules:\n- bikeVariantId must reference an existing bike variant.\n- The uploaded file must be a PDF.\n- The uploaded manual is stored in S3.\n- The bike variant's serviceManualUrl field is updated with the uploaded file URL.\n","operationId":"uploadManual","parameters":[{"name":"bikeVariantId","in":"path","description":"ID of the bike variant to attach the manual to","required":true,"schema":{"type":"integer","format":"int64"},"example":1}],"requestBody":{"content":{"multipart/form-data":{"schema":{"required":["manual"],"type":"object","properties":{"manual":{"type":"string","description":"PDF service manual file","format":"binary"}}}}}},"responses":{"200":{"description":"Service manual uploaded successfully","content":{"text/plain":{"schema":{"type":"string"}}}},"400":{"description":"Invalid bike variant id, missing file, or invalid file type","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ErrorResponse"}}}},"401":{"description":"Missing or invalid license key"}},"security":[{"LicenseKey":[]}]}},"/api/bike-variant/search":{"post":{"tags":["bike-variant-controller"],"summary":"Search bike variants","description":"Searches bike variants using optional filters.\n\nSupported filters:\n- makeId\n- modelId\n- year\n\nIf a filter is empty, it is ignored.\nPaging is applied according to the provided Pageable object.\n","operationId":"searchBikeVariant","requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/BikeVariantSearchDto"}}},"required":true},"responses":{"200":{"description":"Bike variants returned successfully","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Page"}}}},"401":{"description":"Missing or invalid license key"},"400":{"description":"Invalid search payload","content":{"application/json":{}}}},"security":[{"LicenseKey":[]}]}},"/api/bike-variant/import":{"post":{"tags":["bike-variant-controller"],"summary":"Import bike variants from CSV","description":"Imports bike variants from a CSV file.\n\nThe import can create models and bike variants.\n\nExpected CSV headers may include:\n\nmake_id, make, model_id, model, bike_variant_id, year, variant, service_manual_url, cc, cylinder\n\nRules:\n- If bike_variant_id is provided, the existing bike variant is updated.\n- If bike_variant_id is not provided, a new bike variant is created.\n- If model_id is provided, the existing model is used.\n- If model_id is not provided, the model may be created using make_id and model.\n- make_id must reference an existing make when creating a model.\n- Existing duplicate variants are skipped.\n","operationId":"importBikeVariants","requestBody":{"content":{"multipart/form-data":{"schema":{"required":["file"],"t